<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rood Woko – Ma Boutique</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f6b5c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rood Woko">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--card:#fff;--tx:#1d1b18;--mu:#7a746a;--ac:#0f6b5c;--ac2:#e3f1ee;--rd:#c0392b;--bd:#e6e1d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141412;--card:#1f1e1b;--tx:#f1eee7;--mu:#9c968a;--ac:#3fbfa8;--ac2:#1b2f2b;--rd:#ef7b6d;--bd:#2d2b27}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141412;--card:#1f1e1b;--tx:#f1eee7;--mu:#9c968a;--ac:#3fbfa8;--ac2:#1b2f2b;--rd:#ef7b6d;--bd:#2d2b27}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}
main{flex:1;overflow-y:auto;padding:8px 16px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{color:var(--mu);font-size:13px}.v{font-size:20px;font-weight:700;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.amt{font-weight:700;white-space:nowrap}.sub{color:var(--mu);font-size:13px}
.neg{color:var(--rd)}.pos{color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1 0 auto;min-width:72px;border:0;background:none;color:var(--mu);padding:10px 2px;font-size:11px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px #0003}
.btn{border:1px solid var(--ac);background:var(--ac2);color:var(--ac);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px;margin-right:6px}
.x{border:0;background:none;color:var(--mu);font-size:16px;padding:0 0 0 6px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}
#sheet.show{display:flex}
#form{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.ok{width:100%;margin-top:16px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:var(--ac2);color:var(--ac);border:0}
</style>
</head>
<body>
<div id="app">
<header><h1 id="ttl">Rood Woko <span class="sub" style="font-weight:400">· Ma Boutique</span></h1><div><button class="btn" id="cl" style="margin:0 6px 0 0">📱 Sur cet appareil</button><button class="btn" id="cfg" style="margin:0">⚙ Devise</button></div></header>
<main id="main"></main>
</div>
<nav id="nav"></nav>
<button class="fab" id="fab">+ Ajouter</button>
<div id="sheet"><div id="form"></div></div>
<script>
var S={cur:"FCFA",sales:[],exp:[],ord:[],deb:[],sup:[],stk:[],mov:[]},tab="home",sv="list";
try{var raw=localStorage.getItem("boutique_v1");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){S.updated=Date.now();try{localStorage.setItem("boutique_v1",JSON.stringify(S))}catch(e){}push()}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmt(n){return Number(n||0).toLocaleString("fr-FR")+" "+S.cur}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function sum(a,f){return a.reduce(function(t,x){return t+(+f(x)||0)},0)}
var TABS=[["home","🏠","Accueil"],["sales","🛍","Ventes"],["exp","💸","Dépenses"],["ord","📦","Commandes"],["sup","🚚","Fournisseurs"],["deb","🤝","Crédits"],["stk","👕","Stock"]];
var KINDS=["Crédit client (il me doit)","Avance donnée (on me doit)","Avance reçue (client a payé d’avance)"];
var FORMS={
sales:[["article","Article vendu","text"],["client","Client (facultatif)","text"],["amount","Montant total","number"],["paid","Montant payé (vide = tout)","number"]],
exp:[["label","Dépense","text"],["cat","Catégorie","select",["Marchandise","Loyer","Transport","Salaire","Électricité / Eau","Autre"]],["amount","Montant","number"]],
ord:[["client","Client","text"],["article","Article commandé","text"],["total","Prix total","number"],["adv","Avance reçue","number"],["due","Date de livraison","date"]],
deb:[["client","Nom","text"],["kind","Type","select",KINDS],["note","Détail","text"],["total","Montant","number"],["paid","Déjà payé","number"]],
sup:[["sup","Fournisseur","text"],["article","Marchandise commandée","text"],["total","Montant total","number"],["paid","Montant déjà versé","number"],["due","Livraison prévue","date"]],
stk:[["name","Article","text"],["cat","Catégorie","select",["Hommes","Femmes","Enfants","Chaussures","Accessoires","Autre"]],["buy","Prix d’achat (par pièce)","number"],["sell","Prix de vente (par pièce)","number"],["qty","Quantité en stock","number"],["min","Alerte quand il en reste","number"]]};
var TITLES={sales:"Nouvelle vente",exp:"Nouvelle dépense",ord:"Nouvelle commande",deb:"Crédit ou avance",sup:"Commande fournisseur",stk:"Nouvel article en stock"};
var STAT=["En cours","Prête","Livrée"],SST=["Commandée","Reçue"];

function nav(){document.getElementById("nav").innerHTML=TABS.map(function(t){return '<button class="'+(t[0]==tab?"on":"")+'" data-t="'+t[0]+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
document.getElementById("nav").onclick=function(e){var b=e.target.closest("button");if(b){tab=b.dataset.t;render()}};

function render(){
 nav();var m=document.getElementById("main"),h="";
 document.getElementById("fab").style.display=tab=="home"?"none":"block";
 if(tab=="home"){
  var mo=today().slice(0,7),td=today();
  var vm=sum(S.sales.filter(function(x){return x.d.slice(0,7)==mo}),function(x){return x.amount});
  var vt=sum(S.sales.filter(function(x){return x.d==td}),function(x){return x.amount});
  var em=sum(S.exp.filter(function(x){return x.d.slice(0,7)==mo}),function(x){return x.amount});
  var rec=sum(S.deb.filter(function(x){return x.kind!=KINDS[2]}),function(x){return x.total-x.paid});
  var av=sum(S.deb.filter(function(x){return x.kind==KINDS[2]}),function(x){return x.total-x.paid});
  var oc=S.ord.filter(function(o){return o.st<2}).length;var fo=sum(S.sup,function(x){return x.total-x.paid});var ls=S.stk.filter(function(x){return x.qty<=x.min}).length;
  var bn=vm-em;
  h='<div class="grid"><div class="card"><div class="k">Ventes aujourd’hui</div><div class="v">'+fmt(vt)+'</div></div>'+
  '<div class="card"><div class="k">Ventes du mois</div><div class="v">'+fmt(vm)+'</div></div>'+
  '<div class="card"><div class="k">Dépenses du mois</div><div class="v neg">'+fmt(em)+'</div></div>'+
  '<div class="card"><div class="k">Bénéfice estimé</div><div class="v '+(bn<0?"neg":"pos")+'">'+fmt(bn)+'</div></div>'+
  '<div class="card"><div class="k">À recevoir (crédits)</div><div class="v">'+fmt(rec)+'</div></div>'+
  '<div class="card"><div class="k">Commandes en cours</div><div class="v">'+oc+'</div></div></div>'+
  (av>0?'<div class="card"><div class="k">Avances reçues restant à livrer</div><div class="v">'+fmt(av)+'</div></div>':"")+
  '<div class="grid"><div class="card"><div class="k">Dû aux fournisseurs</div><div class="v neg">'+fmt(fo)+'</div></div><div class="card"><div class="k">Stock bas</div><div class="v">'+ls+' article(s)</div></div></div><button class="btn" id="bk">Sauvegarder</button><button class="btn" id="rs">Restaurer</button><p class="sub">Les données sont enregistrées sur cet appareil. Pense à sauvegarder de temps en temps.</p>';
 } else {
  if(tab=="stk")h+=stkHead();var L=(tab=="stk"&&sv=="mov"?S.mov:S[tab]).slice().reverse();
  if(!L.length)h='<div class="empty">Rien pour l’instant.<br>Appuie sur « + Ajouter ».</div>';
  h+=L.map(function(x){return item(x)}).join("");
 }
 m.innerHTML=h;
}
function stkHead(){var v1=sum(S.stk,function(p){return p.qty*(p.buy||0)}),v2=sum(S.stk,function(p){return p.qty*(p.sell||0)}),nq=sum(S.stk,function(p){return p.qty}),lw=S.stk.filter(function(p){return p.qty<=p.min}).length;
 return '<div class="grid"><div class="card"><div class="k">Articles / pièces</div><div class="v">'+S.stk.length+' / '+nq+'</div></div><div class="card"><div class="k">Stock bas</div><div class="v '+(lw?"neg":"")+'">'+lw+'</div></div><div class="card"><div class="k">Valeur (achat)</div><div class="v">'+fmt(v1)+'</div></div><div class="card"><div class="k">Valeur (vente)</div><div class="v">'+fmt(v2)+'</div></div></div><div style="display:flex;gap:6px;margin-bottom:10px"><button class="btn" data-sv="list" style="margin:0'+(sv=="list"?";font-weight:700":"")+'">Articles</button><button class="btn" data-sv="mov" style="margin:0'+(sv=="mov"?";font-weight:700":"")+'">Mouvements</button></div>'+(sv=="list"?'<input id="sq" placeholder="Rechercher un article…" style="margin-bottom:10px">':"");}
function item(x){
 var id=esc(x.id),del='<button class="x" data-del="'+id+'">✕</button>',s="";
 if(tab=="sales")s='<div class="card"><div class="row"><div><b>'+esc(x.article)+'</b><div class="sub">'+esc(x.client||"Client de passage")+' · '+x.d+'</div></div><div class="amt">'+fmt(x.amount)+del+'</div></div>'+(x.paid<x.amount?'<div class="sub neg">Reste à payer : '+fmt(x.amount-x.paid)+'</div>':"")+'</div>';
 if(tab=="exp")s='<div class="card"><div class="row"><div><b>'+esc(x.label)+'</b><div class="sub">'+esc(x.cat)+' · '+x.d+'</div></div><div class="amt neg">'+fmt(x.amount)+del+'</div></div></div>';
 if(tab=="ord"){var r=x.total-x.adv;
  s='<div class="card"><div class="row"><div><b>'+esc(x.client)+'</b> — '+esc(x.article)+'<div class="sub">'+(x.due?"Livraison : "+x.due:"Sans date")+'</div></div><div class="amt">'+fmt(x.total)+del+'</div></div>'+
  '<div class="sub">Avance : '+fmt(x.adv)+' · Reste : <b class="'+(r>0?"neg":"pos")+'">'+fmt(r)+'</b></div>'+
  '<button class="btn" data-st="'+id+'">'+STAT[x.st]+' ›</button>'+(r>0?'<button class="btn" data-solde="'+id+'">Solder</button>':"")+'</div>';}
 if(tab=="deb"){var rest=x.total-x.paid,p=Math.min(100,Math.round(x.paid/x.total*100)||0);
  s='<div class="card"><div class="row"><div><b>'+esc(x.client)+'</b><div class="sub">'+esc(x.kind.split(" (")[0])+(x.note?" · "+esc(x.note):"")+' · '+x.d+'</div></div><div class="amt">'+fmt(x.total)+del+'</div></div>'+
  '<div class="bar"><i style="width:'+p+'%"></i></div><div class="sub">Payé : '+fmt(x.paid)+' · Reste : <b class="'+(rest>0?"neg":"pos")+'">'+fmt(rest)+'</b></div>'+
  (rest>0?'<button class="btn" data-pay="'+id+'">+ Paiement</button>':'<span class="chip">Soldé ✓</span>')+'</div>';}
 if(tab=="sup"){var rs2=x.total-x.paid;s='<div class="card"><div class="row"><div><b>'+esc(x.sup)+'</b> — '+esc(x.article)+'<div class="sub">'+(x.due?"Prévue : "+x.due:"Sans date")+' · '+x.d+'</div></div><div class="amt">'+fmt(x.total)+del+'</div></div><div class="sub">Versé : '+fmt(x.paid)+' · Reste à payer : <b class="'+(rs2>0?"neg":"pos")+'">'+fmt(rs2)+'</b></div><button class="btn" data-sst="'+id+'">'+SST[x.st]+' ›</button>'+(rs2>0?'<button class="btn" data-pay="'+id+'">+ Paiement</button>':"")+'</div>';}
 if(tab=="stk"&&sv=="list"&&0){var lo=x.qty<=x.min;s='<div class="card"><div class="row"><div><b>'+esc(x.name)+'</b><div class="sub">'+(lo?'<span class="neg">Stock bas</span> · ':"")+'Alerte à '+x.min+'</div></div><div class="amt'+(lo?" neg":"")+'">'+x.qty+del+'</div></div><button class="btn" data-q="-1:'+id+'">− 1</button><button class="btn" data-q="1:'+id+'">+ 1</button><button class="btn" data-q="10:'+id+'">+ 10</button></div>';}
 if(tab=="stk"&&sv=="list"){var lw2=x.qty<=x.min,mg=(x.sell||0)-(x.buy||0);s='<div class="card" data-n="'+esc((x.name+" "+(x.cat||"")).toLowerCase())+'"><div class="row"><div><b>'+esc(x.name)+'</b><div class="sub">'+esc(x.cat||"")+(x.buy||x.sell?' · Achat '+fmt(x.buy)+' · Vente '+fmt(x.sell):"")+'</div>'+(x.sell?'<div class="sub">Marge : '+fmt(mg)+' par pièce</div>':"")+(lw2?'<div class="sub neg">⚠ Stock bas (alerte à '+x.min+')</div>':"")+'</div><div class="amt'+(lw2?" neg":"")+'" style="font-size:22px">'+x.qty+del+'</div></div><button class="btn" data-in="'+id+'">+ Entrée</button><button class="btn" data-out="'+id+'">− Sortie</button><button class="btn" data-ed="'+id+'">Modifier prix</button></div>';}
 if(tab=="stk"&&sv=="mov"){s='<div class="card"><div class="row"><div><b>'+esc(x.name)+'</b><div class="sub">'+x.d+' · '+esc(x.note||"")+'</div></div><div class="amt '+(x.type=="Entrée"?"pos":"neg")+'">'+(x.type=="Entrée"?"+":"−")+x.qty+'</div></div></div>';}
 return s;
}
document.getElementById("main").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(b.id=="bk"){var t=JSON.stringify(S);try{navigator.clipboard.writeText(t).then(function(){alert("Données copiées. Colle-les dans une note ou un message WhatsApp pour les garder.")},function(){prompt("Copie ce texte :",t)})}catch(err){prompt("Copie ce texte :",t)}return}
 if(b.id=="rs"){var r=prompt("Colle ici les données sauvegardées :");if(r){try{S=Object.assign({cur:"FCFA",sales:[],exp:[],ord:[],deb:[],sup:[],stk:[],mov:[]},JSON.parse(r));save();render()}catch(err){alert("Données invalides.")}}return}
 function find(id){return S[tab].filter(function(x){return x.id==id})[0]}
 if(d.del){if(confirm("Supprimer cet élément ?")){S[tab]=S[tab].filter(function(x){return x.id!=d.del});save();render()}}
 if(d.st){var o=find(d.st);o.st=(o.st+1)%3;save();render()}
 if(d.sst){var q2=find(d.sst);q2.st=(q2.st+1)%2;save();render();if(q2.st==1)alert("Commande reçue. Pense à ajouter les articles au stock avec « + Entrée ».")}
 if(d.sv){sv=d.sv;render()}
 if(d.in||d.out){var p=find(d.in||d.out),n=parseFloat(prompt((d.in?"Quantité reçue":"Quantité sortie")+" — "+p.name+" (en stock : "+p.qty+")"));if(n>0){if(d.out&&n>p.qty){alert("Pas assez en stock.")}else{p.qty+=d.in?n:-n;S.mov.push({id:uid(),d:today(),name:p.name,type:d.in?"Entrée":"Sortie",qty:n,note:d.in?"Réception":"Sortie manuelle"});save();render()}}}
 if(d.ed){var p2=find(d.ed),nb=prompt("Prix d’achat ("+S.cur+")",p2.buy||0);if(nb!==null){var ns=prompt("Prix de vente ("+S.cur+")",p2.sell||0);if(ns!==null){p2.buy=parseFloat(nb)||0;p2.sell=parseFloat(ns)||0;save();render()}}}
 if(d.q){var pr=d.q.split(":"),it=find(pr[1]);it.qty=Math.max(0,it.qty+parseInt(pr[0]));save();render()}
 if(d.solde){var o2=find(d.solde);o2.adv=o2.total;save();render()}
 if(d.pay){var x=find(d.pay),v=parseFloat(prompt("Montant payé ("+S.cur+") — reste "+(x.total-x.paid)));if(v>0){x.paid=Math.min(x.total,x.paid+v);save();render()}}
};
document.getElementById("main").oninput=function(e){if(e.target.id=="sq"){var q=e.target.value.toLowerCase();document.querySelectorAll("[data-n]").forEach(function(c){c.style.display=c.dataset.n.indexOf(q)>=0?"":"none"})}};
document.getElementById("fab").onclick=function(){
 var f=getForm(),h='<h2 style="margin:0 0 4px;font-size:18px">'+TITLES[tab]+'</h2>';
 f.forEach(function(q){h+='<label>'+q[1]+'</label>';
  if(q[2]=="select")h+='<select id="f_'+q[0]+'">'+q[3].map(function(o){return '<option>'+esc(o)+'</option>'}).join("")+'</select>';
  else h+='<input id="f_'+q[0]+'" type="'+q[2]+'"'+(q[2]=="number"?' inputmode="decimal"':"")+'>'});
 h+='<button class="ok" id="okb">Enregistrer</button><button class="btn" id="cnl" style="width:100%;margin:10px 0 0;padding:12px">Annuler</button>';
 document.getElementById("form").innerHTML=h;document.getElementById("sheet").classList.add("show");
 document.getElementById("cnl").onclick=closeSheet;
 document.getElementById("okb").onclick=submit;
};
function getForm(){if(tab=="sales"){return [["pid","Article du stock (facultatif)","select",["—"].concat(S.stk.map(function(p){return p.name+" ("+p.qty+")"}))],["qty","Quantité vendue","number"]].concat(FORMS.sales)}return FORMS[tab]}
function closeSheet(){document.getElementById("sheet").classList.remove("show")}
function submit(){
 var v={};getForm().forEach(function(q){var e=document.getElementById("f_"+q[0]).value;v[q[0]]=q[2]=="number"?(parseFloat(e)||0):e.trim()});
 var base={id:uid(),d:today()};
 if(tab=="sales"){var pi=document.getElementById("f_pid").selectedIndex-1,pp=pi>=0?S.stk[pi]:null,sq=v.qty||1;if(pp){if(!v.article)v.article=pp.name;if(v.amount<=0)v.amount=(pp.sell||0)*sq}if(!v.article||v.amount<=0){alert("Indique l’article et le montant.");return}if(pp){if(sq>pp.qty&&!confirm("Stock insuffisant ("+pp.qty+" en stock). Continuer ?"))return;pp.qty=Math.max(0,pp.qty-sq);S.mov.push({id:uid(),d:base.d,name:pp.name,type:"Sortie",qty:sq,note:"Vente"})}delete v.pid;
  if(!document.getElementById("f_paid").value)v.paid=v.amount;v.paid=Math.min(v.paid,v.amount);
  S.sales.push(Object.assign(base,v));
  if(v.paid<v.amount)S.deb.push({id:uid(),d:base.d,client:v.client||"Client",kind:KINDS[0],note:v.article,total:v.amount,paid:v.paid});}
 if(tab=="exp"){if(!v.label||v.amount<=0){alert("Indique la dépense et le montant.");return}S.exp.push(Object.assign(base,v))}
 if(tab=="ord"){if(!v.client||!v.article||v.total<=0){alert("Client, article et prix sont nécessaires.");return}v.adv=Math.min(v.adv,v.total);v.st=0;S.ord.push(Object.assign(base,v))}
 if(tab=="deb"){if(!v.client||v.total<=0){alert("Indique le nom et le montant.");return}v.paid=Math.min(v.paid,v.total);S.deb.push(Object.assign(base,v))}
 if(tab=="sup"){if(!v.sup||v.total<=0){alert("Indique le fournisseur et le montant.");return}v.paid=Math.min(v.paid,v.total);v.st=0;S.sup.push(Object.assign(base,v))}
 if(tab=="stk"){if(!v.name){alert("Indique l’article.");return}S.stk.push(Object.assign(base,v));if(v.qty>0)S.mov.push({id:uid(),d:base.d,name:v.name,type:"Entrée",qty:v.qty,note:"Stock initial"})}
 save();closeSheet();render();
}
var cdoc=null,ctimer=null;
function stat(t){var e=document.getElementById("cl");if(e)e.textContent={local:"📱 Sur cet appareil",ok:"☁ Synchronisé",busy:"☁ Envoi…",err:"⚠ Erreur de synchro"}[t]}
function push(){if(!cdoc)return;stat("busy");clearTimeout(ctimer);ctimer=setTimeout(function(){cdoc.set({data:JSON.stringify(S),updated:S.updated||0}).then(function(){stat("ok")},function(){stat("err")})},1200)}
function pull(){if(!cdoc)return;stat("busy");cdoc.get().then(function(s){var r=s.exists?s.data():null;if(r&&(r.updated||0)>(S.updated||0)){try{S=Object.assign({cur:"FCFA",sales:[],exp:[],ord:[],deb:[],sup:[],stk:[],mov:[]},JSON.parse(r.data));try{localStorage.setItem("boutique_v1",JSON.stringify(S))}catch(e){}render()}catch(e){}stat("ok")}else if(!r||(S.updated||0)>(r.updated||0)){push()}else{stat("ok")}},function(){stat("err")})}
(async function(){try{if(!window.claude||!window.claude.use)return;var db=await window.claude.use("db"),u=await window.claude.use("user");if(!db||!u)return;var id=await u.id();if(!id)return;cdoc=db.doc("data/users/"+id+"/boutique");pull()}catch(e){stat("err")}})();
document.addEventListener("visibilitychange",function(){if(!document.hidden)pull()});
document.getElementById("cl").onclick=function(){if(cdoc)pull();else alert("La synchronisation en ligne n’existe que dans la version ouverte depuis ton compte Claude. Ici, tes données restent sur ce téléphone : utilise Sauvegarder / Restaurer sur l’accueil.")};
document.getElementById("cfg").onclick=function(){var c=prompt("Devise (ex : FCFA, €, $, DH) :",S.cur);if(c!==null&&c.trim()){S.cur=c.trim();save();render()}};
if("serviceWorker" in navigator&&!window.Capacitor&&location.protocol.indexOf("http")==0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
render();
</script>
</body>
</html>
